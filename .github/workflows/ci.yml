name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Verify canonical Ashwood export
        run: |
          gradle exportAshwoodWolfAssets --stacktrace
          git diff --exit-code -- \
            src/main/resources/assets/world_rpg/geo/ashwood_wolf.geo.json \
            src/main/resources/assets/world_rpg/animations/ashwood_wolf.animation.json \
            src/main/resources/assets/world_rpg/textures/entity/ashwood_wolf.png

      - name: Build
        run: gradle build --stacktrace
