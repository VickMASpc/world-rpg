import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.nio.charset.StandardCharsets
import java.util.Base64

tasks.register("exportAshwoodWolfAssets") {
    group = "world rpg"
    description = "Export the canonical Ashwood Wolf Blockbench source to GeckoLib runtime assets."

    doLast {
        def sourceFile = file(rootDir.toString() + "/assets-source/creatures/ashwood_wolf.bbmodel")
        if (!sourceFile.exists()) {
            throw new GradleException("Missing canonical Ashwood Wolf source: " + sourceFile)
        }

        def source = new JsonSlurper().parse(sourceFile)
        def elementById = source.elements.collectEntries { element ->
            [(element.uuid.toString()): element]
        }

        def number = { value ->
            if (value instanceof Number) {
                return value.doubleValue()
            }
            return new BigDecimal(value.toString()).doubleValue()
        }

        def zero3 = { values ->
            values == null || values.every { value ->
                number(value) == 0.0d
            }
        }

        def compileCube
        compileCube = { cube ->
            def from = cube.from.collect(number)
            def to = cube.to.collect(number)
            def size = (0..2).collect { axis ->
                to[axis] - from[axis]
            }

            def result = [
                    origin: [
                            -(from[0] + size[0]),
                            from[1],
                            from[2]
                    ],
                    size  : size
            ]

            if (cube.inflate != null
                    && number(cube.inflate) != 0.0d) {
                result.inflate = number(cube.inflate)
            }

            if (!zero3(cube.rotation)) {
                def pivot = (cube.origin ?: [0, 0, 0])
                        .collect(number)
                def rotation = cube.rotation.collect(number)
                result.pivot = [
                        -pivot[0],
                        pivot[1],
                        pivot[2]
                ]
                result.rotation = [
                        -rotation[0],
                        -rotation[1],
                        rotation[2]
                ]
            }

            def uv = new LinkedHashMap<String, Object>()
            (cube.faces ?: [:]).each { direction, face ->
                if (!face.containsKey("texture")
                        || face.texture == null) {
                    return
                }

                def sourceUv = face.uv.collect(number)
                double u = sourceUv[0]
                double v = sourceUv[1]
                double width = sourceUv[2] - sourceUv[0]
                double height = sourceUv[3] - sourceUv[1]

                if (direction == "up" || direction == "down") {
                    u += width
                    v += height
                    width *= -1.0d
                    height *= -1.0d
                }

                def exportedFace = [
                        uv     : [u, v],
                        uv_size: [width, height]
                ]

                if (face.rotation) {
                    exportedFace.uv_rotation =
                            number(face.rotation)
                }

                uv[direction.toString()] = exportedFace
            }

            result.uv = uv
            return result
        }

        def bones = []
        def walkGroup
        walkGroup = { group, String parentName ->
            def origin = (group.origin ?: [0, 0, 0])
                    .collect(number)

            def bone = [
                    name : group.name.toString(),
                    pivot: [
                            -origin[0],
                            origin[1],
                            origin[2]
                    ]
            ]

            if (parentName != null) {
                bone.parent = parentName
            }

            if (!zero3(group.rotation)) {
                def rotation = group.rotation.collect(number)
                bone.rotation = [
                        -rotation[0],
                        -rotation[1],
                        rotation[2]
                ]
            }

            def cubes = []
            (group.children ?: []).each { child ->
                if (child instanceof String) {
                    def element = elementById[child]
                    if (element != null
                            && element.type == "cube"
                            && element.export != false) {
                        cubes << compileCube(element)
                    }
                }
            }
            if (!cubes.isEmpty()) {
                bone.cubes = cubes
            }

            bones << bone

            (group.children ?: []).each { child ->
                if (child instanceof Map
                        && child.name != null) {
                    walkGroup(
                            child,
                            group.name.toString()
                    )
                }
            }
        }

        (source.outliner ?: []).each { root ->
            if (root instanceof Map) {
                walkGroup(root, null)
            }
        }

        def flipVector = { String channel, point ->
            def raw = [
                    point.x ?: "0",
                    point.y ?: "0",
                    point.z ?: "0"
            ]

            return raw.withIndex().collect { value, axis ->
                double output = number(value)
                boolean invert =
                        (channel == "position" && axis == 0)
                                || (channel == "rotation"
                                && (axis == 0 || axis == 1))
                return invert ? -output : output
            }
        }

        def compileKeyframe = { String channel, keyframe ->
            def points = (keyframe.data_points ?: [])
                    .collect { point ->
                        flipVector(channel, point)
                    }

            if (keyframe.interpolation == "catmullrom") {
                return [
                        post     : points
                                ? points.last()
                                : [0.0d, 0.0d, 0.0d],
                        lerp_mode: "catmullrom"
                ]
            }

            if (points.size() <= 1) {
                return points
                        ? points[0]
                        : [0.0d, 0.0d, 0.0d]
            }

            return [
                    pre : points[0],
                    post: points[1]
            ]
        }

        def animations = new LinkedHashMap<String, Object>()
        (source.animations ?: []).each { sourceAnimation ->
            def animation = new LinkedHashMap<String, Object>()

            if (sourceAnimation.loop == "loop") {
                animation.loop = true
            } else if (sourceAnimation.loop == "hold") {
                animation.loop = "hold_on_last_frame"
            }

            if (sourceAnimation.length) {
                animation.animation_length =
                        number(sourceAnimation.length)
            }

            def animationBones =
                    new LinkedHashMap<String, Object>()

            (sourceAnimation.animators ?: [:])
                    .values()
                    .each { animator ->
                if (animator.type != "bone"
                        || !(animator.keyframes ?: [])) {
                    return
                }

                def boneAnimation =
                        new LinkedHashMap<String, Object>()

                ["rotation", "position", "scale"].each { channel ->
                    def frames = (animator.keyframes ?: [])
                            .findAll { frame ->
                                frame.channel == channel
                            }
                            .sort { left, right ->
                                number(left.time)
                                        <=> number(right.time)
                            }

                    if (frames.isEmpty()) {
                        return
                    }

                    def encoded =
                            new LinkedHashMap<String, Object>()

                    frames.each { frame ->
                        String time = String.format(
                                Locale.ROOT,
                                "%.4f",
                                number(frame.time)
                        )
                                .replaceAll('0+$', '')
                                .replaceAll('\\.$', '')

                        if (!time.contains(".")) {
                            time += ".0"
                        }

                        encoded[time] =
                                compileKeyframe(channel, frame)
                    }

                    boneAnimation[channel] = encoded
                }

                if (!boneAnimation.isEmpty()) {
                    animationBones[
                            animator.name.toString()
                    ] = boneAnimation
                }
            }

            animation.bones = animationBones
            animations[sourceAnimation.name.toString()] =
                    animation
        }

        def geometry = [
                format_version       : "1.12.0",
                "minecraft:geometry": [[
                        description: [
                                identifier           : "geometry.world_rpg.ashwood_wolf",
                                texture_width        : number(source.resolution.width).intValue(),
                                texture_height       : number(source.resolution.height).intValue(),
                                visible_bounds_width : 4.0d,
                                visible_bounds_height: 3.0d,
                                visible_bounds_offset: [0.0d, 1.25d, 0.0d]
                        ],
                        bones      : bones
                ]]
        ]

        def animationFile = [
                format_version         : "1.8.0",
                animations             : animations,
                geckolib_format_version: 2
        ]

        def geometryFile = file(
                rootDir.toString() + "/src/main/resources/assets/world_rpg/geo/ashwood_wolf.geo.json"
        )
        def animationsFile = file(
                rootDir.toString() + "/src/main/resources/assets/world_rpg/animations/ashwood_wolf.animation.json"
        )
        def textureFile = file(
                rootDir.toString() + "/src/main/resources/assets/world_rpg/textures/entity/ashwood_wolf.png"
        )

        geometryFile.parentFile.mkdirs()
        animationsFile.parentFile.mkdirs()
        textureFile.parentFile.mkdirs()

        geometryFile.setText(
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(geometry)
                ) + System.lineSeparator(),
                StandardCharsets.UTF_8.name()
        )
        animationsFile.setText(
                JsonOutput.prettyPrint(
                        JsonOutput.toJson(animationFile)
                ) + System.lineSeparator(),
                StandardCharsets.UTF_8.name()
        )

        String textureSource =
                source.textures[0].source.toString()
        String prefix = "data:image/png;base64,"
        if (!textureSource.startsWith(prefix)) {
            throw new GradleException(
                    "Ashwood Wolf texture is not an embedded PNG"
            )
        }

        textureFile.bytes = Base64.decoder.decode(
                textureSource.substring(prefix.length())
        )

        logger.lifecycle(
                "Exported Ashwood Wolf: "
                        + bones.size()
                        + " bones, "
                        + source.elements.size()
                        + " cubes, "
                        + animations.keySet().join(", ")
        )
    }
}
